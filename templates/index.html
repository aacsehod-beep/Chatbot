<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuroMate</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <style>
    :root {
      --bg-color: #f9f9f8;
      --text-main: #3d3935;
      --text-dim: #76716a;
      --pill-bg: #ecece8;
      --pill-hover: #e5e5df;
      --orange-star: #d36e52;
      --input-border: #e2e2dd;
      --input-bg: #ffffff;
      --tools-bg: #f3f3f0;
      --accent-blue: #e3effd;
      --accent-blue-text: #4185d0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Top Right Profile */
    .top-right-bar {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      display: flex;
      align-items: center;
    }

    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .profile-btn:hover {
      background: var(--pill-bg);
      color: var(--text-main);
    }

    /* Main Container for rest state */
    .rest-container {
      margin-top: 15vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 760px;
      padding: 0 1rem;
      transition: opacity 0.3s;
    }

    /* Pill */
    .plan-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--pill-bg);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.825rem;
      color: #645f5a;
      margin-bottom: 24px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .plan-pill:hover {
      background-color: var(--pill-hover);
    }

    .plan-pill .upgrade {
      font-weight: 500;
      color: var(--text-main);
    }

    /* Greeting */
    .greeting-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
    }

    .star-icon {
      color: var(--orange-star);
    }

    .greeting-text {
      font-family: 'Playfair Display', ui-serif, Georgia, serif;
      font-size: 2.5rem;
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    /* Prompt Input Area */
    .prompt-box {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .input-wrapper {
      padding: 16px 20px 12px 20px;
      display: flex;
      flex-direction: column;
    }

    .user-input {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      font-size: 1.05rem;
      font-family: inherit;
      color: var(--text-main);
      background: transparent;
      min-height: 80px;
      padding: 0;
    }

    .user-input::placeholder {
      color: #9d968f;
    }

    /* Controls inside prompt box */
    .prompt-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .control-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
      border-radius: 6px;
    }

    .control-btn:hover {
      color: var(--text-main);
    }

    .add-btn {
      padding: 4px;
    }

    .right-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .model-selector {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
    }

    .model-selector:hover {
      background: var(--pill-hover);
    }
    
    .model-selector i {
      color: var(--text-dim);
    }

    .voice-btn {
      padding: 4px;
    }

    /* Connect Tools Footer */
    .tools-footer {
      background: var(--tools-bg);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
      border-top: 1px solid var(--input-border);
      transition: background 0.2s;
    }

    .tools-footer:hover {
      background: #ededec;
    }

    .tools-left {
      display: flex;
      align-items: center;
    }

    .tools-icons {
      display: flex;
      align-items: center;
      gap: -4px;
    }

    .tool-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border: 1px solid var(--input-border);
      margin-left: -4px;
      font-size: 10px;
    }
    .tool-icon:first-child { margin-left: 0; }

    /* Bottom Left Apps */
    .bottom-left-btn {
      position: absolute;
      bottom: 2rem;
      left: 2rem;
      background: var(--accent-blue);
      color: var(--accent-blue-text);
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .bottom-left-btn:hover {
      background: #d4e5fa;
    }

    /* Send button when active */
    .send-btn {
      display: none; /* hidden when empty */
      background: var(--text-main);
      color: white;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .send-btn.visible {
      display: flex;
    }
    
    .voice-btn.hidden {
      display: none;
    }

    /* ─── CHAT VIEW (For after sending request) ─── */
    .chat-view {
      display: none;
      width: 100%;
      max-width: 800px;
      padding: 2rem 1rem 8rem 1rem;
      flex-direction: column;
    }
    .message {
      margin-bottom: 24px;
      line-height: 1.6;
      font-size: 1rem;
      display: flex;
    }
    .message.user {
      justify-content: flex-end;
    }
    .message.user .msg-content {
      background: var(--pill-bg);
      padding: 12px 18px;
      border-radius: 16px;
      max-width: 80%;
      color: var(--text-main);
    }
    .message.bot .msg-content {
      max-width: 90%;
      color: var(--text-main);
    }
    .bot-avatar {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      margin-right: 12px;
      margin-top: 4px;
      color: var(--orange-star);
    }

    /* Chat Input fixed at bottom */
    .bottom-input {
      display: none;
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 760px;
      padding: 0 1rem;
    }

    /* Utility */
    .hidden-block { display: none !important; }
  </style>
</head>
<body>

  <!-- Top Right Profile -->
  <div class="top-right-bar">
    <button class="profile-btn">
      <i data-lucide="ghost" style="width:20px;height:20px;"></i>
    </button>
  </div>

  <!-- Main Resting View -->
  <div class="rest-container" id="restContainer">
    
    <!-- Pill removed -->

    <div class="greeting-container">
      <div class="star-icon">
        <img src="/static/images/log.png" alt="Logo" width="56" height="56" style="object-fit: contain; mix-blend-mode: multiply;">
      </div>
      <div class="greeting-text">AuroMate</div>
    </div>

    <div class="prompt-box">
      <div class="input-wrapper">
        <textarea id="mainInput" class="user-input" placeholder="How can I help you today?" rows="1"></textarea>
        
        <div class="prompt-controls">
          <!-- Plus button removed -->
          
          <div class="right-controls">
            <!-- Model selector removed -->
            <button class="control-btn voice-btn" id="voiceBtn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v20M8 5v14M16 5v14M4 10v4M20 10v4"/>
              </svg>
            </button>
            <button class="send-btn" id="sendBtn" onclick="submitQuery()">
              <i data-lucide="arrow-up" style="width:18px;height:18px;"></i>
            </button>
          </div>
        </div>
      </div>
      
      <!-- Tools footer removed -->
    </div>
  </div>

  <!-- Apps Button removed -->

  <!-- Chat View for Interaction -->
  <div class="chat-view" id="chatView">
    <!-- Messages appended here -->
  </div>

  <!-- Bottom Input for Chat View -->
  <div class="bottom-input" id="bottomInputContainer">
    <!-- Will move the prompt-box here when active -->
  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    const mainInput = document.getElementById('mainInput');
    const sendBtn = document.getElementById('sendBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const restContainer = document.getElementById('restContainer');
    const chatView = document.getElementById('chatView');
    const bottomInputContainer = document.getElementById('bottomInputContainer');
    
    // Guess module logic
    const MODULE_KEYWORDS = {
      Student:    ['student','roll','register','name','age','department','batch','year','semester','cgpa','gpa','marks','grade'],
      Faculty:    ['faculty','teacher','professor','staff','hod','dean','lecturer','mentor'],
      Attendance: ['attendance','present','absent','percentage','leave','proxy','shortage'],
      Timetable:  ['timetable','schedule','class','timing','period','hour','slot','room','lab'],
      Workload:   ['workload','load','hours','assigned','subjects','burden','allocation']
    };

    function guessModule(query) {
      const q = query.toLowerCase();
      const scores = {};
      for (const [mod, keys] of Object.entries(MODULE_KEYWORDS))
        scores[mod] = keys.filter(k => q.includes(k)).length;
      const best = Object.entries(scores).sort((a,b) => b[1]-a[1])[0];
      return (best && best[1] > 0) ? best[0] : 'Student';
    }

    // Auto-resize textarea
    mainInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
      
      // Toggle send/voice button
      if (this.value.trim().length > 0) {
        sendBtn.classList.add('visible');
        voiceBtn.classList.add('hidden');
      } else {
        sendBtn.classList.remove('visible');
        voiceBtn.classList.remove('hidden');
      }
    });

    mainInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitQuery();
      }
    });

    async function submitQuery() {
      const q = mainInput.value.trim();
      if (!q) return;

      // Switch views on first message
      if (restContainer.style.display !== 'none') {
        restContainer.style.display = 'none';
        
        // Move the prompt box to bottom
        const promptBox = document.querySelector('.prompt-box');
        bottomInputContainer.appendChild(promptBox);
        
        chatView.style.display = 'flex';
        bottomInputContainer.style.display = 'block';
      }

      // Add user message
      addMessage(q, 'user');
      
      // Clear input
      mainInput.value = '';
      mainInput.style.height = 'auto';
      sendBtn.classList.remove('visible');
      voiceBtn.classList.remove('hidden');

      // Add loading state
      const loadingId = 'msg-' + Date.now();
      addMessage('...', 'bot', loadingId);

      try {
        const featureGuessed = guessModule(q);
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: q, feature: featureGuessed }) 
        });
        const data = await res.json();
        
        // Update loaded message
        const replyEl = document.getElementById(loadingId);
        if (replyEl) {
          replyEl.innerHTML = data.response || 'No response';
        } else {
          addMessage(data.response, 'bot');
        }

        // Render suggestions if available
        if (data.suggestions && data.suggestions.length > 0) {
          renderSuggestions(data.suggestions);
        }
      } catch(err) {
        const replyEl = document.getElementById(loadingId);
        if (replyEl) replyEl.innerHTML = 'Sorry, there was an error connecting to the server.';
      }
    }

    function addMessage(text, role, id=null) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      
      if (role === 'bot') {
        const avatar = document.createElement('div');
        avatar.className = 'bot-avatar';
        avatar.innerHTML = `<img src="/static/images/log.png" alt="Logo" style="width:100%;height:100%;object-fit:contain; mix-blend-mode: multiply;">`;
        msgDiv.appendChild(avatar);
      }

      const content = document.createElement('div');
      content.className = 'msg-content';
      if (id) content.id = id;
      
      // Basic formatting handle for line breaks
      content.innerHTML = text.replace(/\n/g, '<br>');
      
      msgDiv.appendChild(content);
      chatView.appendChild(msgDiv);
      
      // Scroll to bottom
      window.scrollTo(0, document.body.scrollHeight);
    }

    function renderSuggestions(chips) {
      const suggContainer = document.createElement('div');
      suggContainer.className = 'suggestion-set';
      suggContainer.style.display = 'flex';
      suggContainer.style.flexWrap = 'wrap';
      suggContainer.style.gap = '8px';
      suggContainer.style.marginTop = '12px';
      
      chips.forEach(chipText => {
        const btn = document.createElement('button');
        btn.innerHTML = `<i data-lucide="chevron-right" style="width:12px;height:12px;margin-right:4px;"></i>${chipText}`;
        btn.style.padding = '8px 12px';
        btn.style.borderRadius = '16px';
        btn.style.border = '1px solid var(--input-border)';
        btn.style.background = 'var(--pill-bg)';
        btn.style.color = 'var(--text-main)';
        btn.style.cursor = 'pointer';
        btn.style.display = 'flex';
        btn.style.alignItems = 'center';
        btn.style.fontSize = '0.9rem';
        btn.onclick = () => {
          mainInput.value = chipText;
          submitQuery();
          suggContainer.remove();
        };
        btn.onmouseover = () => btn.style.background = 'var(--pill-hover)';
        btn.onmouseout = () => btn.style.background = 'var(--pill-bg)';
        suggContainer.appendChild(btn);
      });
      
      // Append right below the last bot message content
      const botMessages = chatView.querySelectorAll('.message.bot .msg-content');
      if (botMessages.length > 0) {
        botMessages[botMessages.length - 1].appendChild(suggContainer);
      }
      lucide.createIcons();
      window.scrollTo(0, document.body.scrollHeight);
    }

  </script>
</body>
</html>
